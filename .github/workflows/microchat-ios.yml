name: MicroChat iOS build

on:
  workflow_dispatch:
  push:
    branches: [codex/microchat-ios]
    paths:
      - microchat-ios/**
      - .github/workflows/microchat-ios.yml

permissions:
  contents: read

concurrency:
  group: microchat-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: microchat-ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode and protocol tests
        run: |
          xcodebuild -version
          swift test

      - name: Archive arm64 iPhone application
        run: |
          xcodebuild -project MicroChat.xcodeproj -scheme MicroChat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MicroChat-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/export/Payload
          ditto build/MicroChat-unsigned.xcarchive/Products/Applications/MicroChat.app \
            build/export/Payload/MicroChat.app
          cd build/export
          zip -qry MicroChat-unsigned.ipa Payload
          shasum -a 256 MicroChat-unsigned.ipa > MicroChat-unsigned.ipa.sha256
          printf '%s\n' \
            'This IPA is UNSIGNED. It cannot be installed directly on an iPhone.' \
            'Apple signing/provisioning or an explicitly chosen signing service is still required.' \
            > INSTALL-STATUS.txt

      - name: Save unsigned iPhone build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MicroChat-iOS-unsigned
          path: |
            microchat-ios/build/export/MicroChat-unsigned.ipa
            microchat-ios/build/export/MicroChat-unsigned.ipa.sha256
            microchat-ios/build/export/INSTALL-STATUS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Select an available iPhone Simulator
        id: simulator
        timeout-minutes: 3
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtime, phones in sorted(devices.items(), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              for phone in phones:
                  if phone.get('isAvailable') and phone['name'].startswith('iPhone'):
                      print('id=' + phone['udid'])
                      raise SystemExit(0)
          raise SystemExit('No iPhone Simulator is available on this runner')
          PY

      - name: Build and run tests inside iOS Simulator
        timeout-minutes: 12
        env:
          MICROCHAT_IOS_DESTINATION: platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project MicroChat.xcodeproj -scheme MicroChat -configuration Debug \
            -destination "$MICROCHAT_IOS_DESTINATION" -derivedDataPath build/DerivedData \
            -resultBundlePath build/SimulatorTests.xcresult CODE_SIGNING_ALLOWED=NO test

      - name: Export native interface snapshots
        if: always()
        run: |
          if [ -d build/SimulatorTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SimulatorTests.xcresult --output-path build/QA
          fi

      - name: Save native interface review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MicroChat-iOS-native-QA
          path: microchat-ios/build/QA
          if-no-files-found: ignore
          retention-days: 1

