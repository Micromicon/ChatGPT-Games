name: Mirror The Station to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the complete game
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://the-station-135959.seleothemaestro.chatgpt.site"
          rm -rf public
          mkdir -p public/vendor

          wget -q -O public/index.html "$BASE/"
          wget -q -O public/style.css "$BASE/style.css"
          wget -q -O public/game.js "$BASE/game.js"
          wget -q -O public/world.js "$BASE/world.js"
          wget -q -O public/story.js "$BASE/story.js"
          wget -q -O public/vendor/three.module.js "$BASE/vendor/three.module.js"

          # The source HTML may contain a Cloudflare browser-check snippet.
          # It is unnecessary on GitHub Pages and would point at a non-existent /cdn-cgi path.
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script>.*?__CF\$cv\$params.*?</script>', '', s, flags=re.S)
          s = re.sub(r'<script>.*?/cdn-cgi/challenge-platform.*?</script>', '', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

          touch public/.nojekyll

          test -s public/index.html
          test -s public/style.css
          test -s public/game.js
          test -s public/world.js
          test -s public/story.js
          test -s public/vendor/three.module.js

      - name: Publish game to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
