name: Publish The Station visual novel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'novel/**'
      - 'novel-files.json'
      - '.github/workflows/mirror-the-station.yml'

permissions:
  contents: write

concurrency:
  group: station-novel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare the complete visual novel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path

          origin = 'https://the-station-135959.seleothemaestro.chatgpt.site'
          target = Path('public/novel')
          manifest = json.loads(Path('novel-files.json').read_text())
          for name, expected in manifest.items():
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              source = Path('novel') / name
              if source.is_file():
                  shutil.copyfile(source, destination)
              else:
                  subprocess.run([
                      'curl', '--fail', '--silent', '--show-error', '--location',
                      '--retry', '3', '--max-time', '90',
                      f'{origin}/{name}', '--output', str(destination)
                  ], check=True)
              actual = hashlib.sha256(destination.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Content mismatch: {name}; nothing published')
          print(f'Verified all {len(manifest)} novel files.')
          PY

      - name: Add the novel beside the existing 3D game
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/novel
          destination_dir: novel
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'Publish visual novel at /novel/'
